<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Clone Feed – Big Thumbnails</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="top-nav">
    <div class="nav-left">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="Logo" class="logo">
    </div>
    <div class="nav-center">
      <input type="text" placeholder="Search">
      <button>🔍</button>
    </div>
    <div class="nav-right">
      <button>🎤</button>
      <div class="profile">👤</div>
      <button id="themeToggle">🌙</button>
    </div>
  </header>

  <div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <ul>
        <li>Home</li>
        <li>Trending</li>
        <li>Subscriptions</li>
        <li>Library</li>
      </ul>
    </aside>

    <!-- Video Feed -->
    <main class="video-feed">

      <div class="video">
        <img src="https://i.ytimg.com/vi/ScMzIvxBSi4/maxresdefault.jpg" alt="Video 1">
        <div class="video-info">
          <p class="title">Relaxing Nature Music</p>
          <p class="channel">Nature Relaxation</p>
          <p class="views">1.2M views • 2 days ago</p>
        </div>
      </div>

      <div class="video">
        <img src="https://i.ytimg.com/vi/5qap5aO4i9A/maxresdefault.jpg" alt="Video 2">
        <div class="video-info">
          <p class="title">Lofi Hip Hop Radio</p>
          <p class="channel">Lofi Girl</p>
          <p class="views">900K views • 5 hours ago</p>
        </div>
      </div>

      <div class="video">
        <img src="https://i.ytimg.com/vi/kJQP7kiw5Fk/maxresdefault.jpg" alt="Video 3">
        <div class="video-info">
          <p class="title">Despacito Official Video</p>
          <p class="channel">Luis Fonsi</p>
          <p class="views">7.1B views • 4 years ago</p>
        </div>
      </div>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
