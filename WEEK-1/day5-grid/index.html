<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">MyGallery</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Gallery Section -->
  <section id="gallery" class="gallery-section">
    <h1>Photo Gallery</h1>
    <div class="gallery-grid">
      <div class="photo">
        <img src="https://images.unsplash.com/photo-1584395630827-860eee694d7b?crop=entropy&cs=tinysrgb&fit=crop&w=600&q=80" alt="Nature 1">
        <div class="overlay">Nature 1</div>
      </div>
      <div class="photo">
        <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=crop&w=600&q=80" alt="Nature 2">
        <div class="overlay">Nature 2</div>
      </div>
      <div class="photo">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?crop=entropy&cs=tinysrgb&fit=crop&w=600&q=80" alt="Nature 3">
        <div class="overlay">Nature 3</div>
      </div>
      <div class="photo">
        <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?crop=entropy&cs=tinysrgb&fit=crop&w=600&q=80" alt="Nature 4">
        <div class="overlay">Nature 4</div>
      </div>
      <div class="photo">
        <img src="https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?crop=entropy&cs=tinysrgb&fit=crop&w=600&q=80" alt="Nature 5">
        <div class="overlay">Nature 5</div>
      </div>
      <div class="photo">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?crop=entropy&cs=tinysrgb&fit=crop&w=600&q=80" alt="Nature 6">
        <div class="overlay">Nature 6</div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 MyGallery. All rights reserved.</p>
  </footer>

</body>
</html>
