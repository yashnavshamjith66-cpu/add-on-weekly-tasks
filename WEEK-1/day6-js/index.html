<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 6 – JS Practice</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background-color: #f9f9f9;
    color: #000;
  }
  h1, h2 {
    text-align: center;
  }
  section {
    background: #fff;
    max-width: 400px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  input, select, button {
    width: calc(100% - 20px);
    padding: 8px 10px;
    margin: 5px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 16px;
  }
  button {
    background-color: #333;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background-color: #555;
  }
  p.result {
    font-weight: bold;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Day 6 – JavaScript Practice</h1>

<section>
  <h2>Even/Odd Checker</h2>
  <input type="number" id="evenOddInput" placeholder="Enter a number">
  <button onclick="checkEvenOdd()">Check</button>
  <p id="evenOddResult" class="result"></p>
</section>

<section>
  <h2>Simple Calculator</h2>
  <input type="number" id="calcNum1" placeholder="First Number">
  <input type="number" id="calcNum2" placeholder="Second Number">
  <select id="operation">
    <option value="add">+</option>
    <option value="subtract">-</option>
    <option value="multiply">×</option>
    <option value="divide">÷</option>
  </select>
  <button onclick="calculate()">Calculate</button>
  <p id="calcResult" class="result"></p>
</section>

<script>
function checkEvenOdd() {
  const num = Number(document.getElementById('evenOddInput').value);
  const result = document.getElementById('evenOddResult');

  if (isNaN(num)) {
    result.textContent = 'Please enter a valid number!';
    return;
  }

  result.textContent = (num % 2 === 0) 
    ? `${num} is Even ✅` 
    : `${num} is Odd ❌`;
}

function calculate() {
  const num1 = Number(document.getElementById('calcNum1').value);
  const num2 = Number(document.getElementById('calcNum2').value);
  const op = document.getElementById('operation').value;
  const result = document.getElementById('calcResult');

  if (isNaN(num1) || isNaN(num2)) {
    result.textContent = 'Please enter valid numbers!';
    return;
  }

  let answer;
  switch(op) {
    case 'add': answer = num1 + num2; break;
    case 'subtract': answer = num1 - num2; break;
    case 'multiply': answer = num1 * num2; break;
    case 'divide': answer = num2 !== 0 ? num1 / num2 : 'Cannot divide by zero!'; break;
    default: answer = 'Invalid operation!';
  }

  result.textContent = `Result: ${answer}`;
}
</script>

</body>
</html>
